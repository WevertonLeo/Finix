server {
    # Porta que o Nginx vai escutar dentro do container
    listen 80;

    # Onde ficam os arquivos do Laravel
    root /var/www/public;

    # Arquivo padrão a servir
    index index.php index.html;

    # Nome do servidor (qualquer um funciona em dev)
    server_name _;

    # Configuração principal de rotas
    location / {
        # Tenta servir o arquivo, depois o diretório,
        # e se não achar, manda pro index.php (Laravel Router)
        # Isso é o que faz as rotas do Laravel funcionarem
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Quando a URL termina em .php, manda pro PHP-FPM
    location ~ \.php$ {
        # "php" é o nome do container no docker-compose
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
    }

    # Aumenta o tamanho máximo de upload (para importar extratos)
    client_max_body_size 20M;

    # Logs dentro do container
    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
}